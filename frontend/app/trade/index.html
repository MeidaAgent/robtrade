<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RobTrade · Trade</title><link rel="stylesheet" href="/app/style.css"></head><body><main class="shell"><nav><a class="brand" href="/">RobTrade</a><a href="/app">Vault</a><a href="/app/trade">Trade</a><a href="/sdk">SDK</a><span data-status>Not connected</span></nav><section class="hero"><p class="eyebrow">TRADE · ROBINHOOD CHAIN</p><h1>Quote, lock the expected calldata, then verify the transaction.</h1><p class="muted">The current adapter is a public-wallet 0x route. It is intentionally separated from the privacy pool until a private executor/relayer is deployed.</p><div class="actions"><button id="login">Connect & Sign In</button><span class="pill">Public execution</span></div></section><section class="card"><div class="two"><label>Token in<input id="tokenIn" placeholder="0x…"></label><label>Token out<input id="tokenOut" placeholder="0x…"></label></div><label>Amount in<input id="amountIn" inputmode="numeric"></label><div class="actions"><button id="quoteBtn">Get quote</button><button id="orderBtn" disabled>Create order</button><button id="sendBtn" disabled>Send & submit</button></div><pre id="out"></pre></section></main><script type="module">import {api,signIn,sendPreparedTx,mountStatus} from '/app/common.js';const $=id=>document.getElementById(id);let quote=null,order=null;mountStatus();$('login').onclick=async()=>{try{await signIn();mountStatus()}catch(e){alert(e.message)}};$('quoteBtn').onclick=async()=>{try{quote=await api('/swap/quote',{method:'POST',body:JSON.stringify({tokenIn:$('tokenIn').value,tokenOut:$('tokenOut').value,amountIn:$('amountIn').value})});$('out').textContent=JSON.stringify(quote,null,2);$('orderBtn').disabled=false}catch(e){$('out').textContent=e.message}};$('orderBtn').onclick=async()=>{try{order=await api('/swap/orders',{method:'POST',body:JSON.stringify({quoteId:quote.quoteId})});$('out').textContent+=`\n\nORDER:\n${JSON.stringify(order,null,2)}`;$('sendBtn').disabled=false}catch(e){$('out').textContent=e.message}};$('sendBtn').onclick=async()=>{try{const tx={to:order.order.expectedTo,data:order.order.expectedData,value:order.order.expectedValue};const hash=await sendPreparedTx(tx);const r=await api(`/swap/orders/${order.order.id}/submit`,{method:'POST',body:JSON.stringify({txHash:hash})});$('out').textContent+=`\n\nSUBMIT:\n${JSON.stringify(r,null,2)}`;}catch(e){$('out').textContent=e.message}};</script></body></html>
