services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robtrade
      POSTGRES_USER: robtrade
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - robtrade-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robtrade -d robtrade"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  robtrade-postgres:
